services:
  # ── PostgreSQL Database ──────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: smarthome_db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Server ────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthome_server
    restart: always
    ports:
      - "3100:3100"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  # ── AI Power Analytics ───────────────────────────
  ai-analytics:
    build:
      context: ../AI_PhanTichDien
      dockerfile: Dockerfile
    container_name: smarthome_ai_analytics
    restart: always
    volumes:
      - ../AI_PhanTichDien/configs:/app/configs
      - ../AI_PhanTichDien/logs:/app/logs
    depends_on:
      - server

  # ── AI Weather Forecast ──────────────────────────
  ai-forecast:
    build:
      context: ../AI_DuBaoTT
      dockerfile: Dockerfile
    container_name: smarthome_ai_forecast
    restart: always
    command: ["python", "src/realtime_forecast.py", "--use-mqtt", "--watch", "--interval", "60"]
    depends_on:
      - server

volumes:
  postgres_data:
    driver: local
