services:
  # ── PostgreSQL Database ──────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: smarthome_db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Server ────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthome_server
    restart: always
    ports:
      - "3100:3100"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  # ── AI Prediction Service ────────────────────────
  ai-service:
    build:
      context: ../ai_predict_service
      dockerfile: Dockerfile
    container_name: smarthome_ai
    restart: always
    env_file:
      - ../ai_predict_service/.env
    # Sử dụng DATABASE_URL từ file .env riêng của AI service để bảo mật
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
